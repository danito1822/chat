<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Chat Moderno</title>
    <style>
        :root {
            --primary: #7289da;
            --secondary: #ffffff;
            --dark: #2c2f33;
            --darker: #23272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: var(--dark);
            min-height: 100vh;
            overflow: hidden;
        }

        .particles-background {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .chat-container {
            max-width: 1200px;
            margin: 20px auto;
            background: rgba(44, 47, 51, 0.9);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .chat-header {
            background: var(--darker);
            padding: 20px;
            text-align: center;
        }

        .chat-header h1 {
            color: var(--secondary);
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .chat-messages {
            height: 60vh;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            background: var(--darker);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            animation: fadeIn 0.5s ease;
            transition: transform 0.3s ease;
        }

        .message:hover {
            transform: translateX(10px);
        }

        .message .username {
            color: var(--primary);
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message .text {
            color: var(--secondary);
            line-height: 1.4;
        }

        .input-container {
            display: flex;
            padding: 20px;
            background: var(--darker);
        }

        .message-input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 25px;
            background: var(--dark);
            color: var(--secondary);
            font-size: 16px;
            margin-right: 15px;
            transition: all 0.3s ease;
        }

        .message-input:focus {
            outline: none;
            box-shadow: 0 0 10px var(--primary);
        }

        .send-button {
            background: var(--primary);
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            color: var(--secondary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .send-button:hover {
            background: #5b6eae;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div id="particles-js" class="particles-background"></div>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>Chat Moderno</h1>
        </div>
        
        <div class="chat-messages" id="messages"></div>
        
        <div class="input-container">
            <input type="text" class="message-input" id="messageInput" placeholder="Escribe tu mensaje...">
            <button class="send-button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            particles: {
                number: { value: 80 },
                color: { value: '#7289da' },
                shape: { type: 'circle' },
                opacity: { value: 0.5 },
                size: { value: 3 },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: false,
                    straight: false,
                    out_mode: 'out',
                    bounce: false,
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' },
                    resize: true
                }
            },
            retina_detect: true
        });

        const ws = new WebSocket('ws://' + window.location.host + '/ws');
        
        ws.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            const messages = document.getElementById('messages');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message';
            messageDiv.innerHTML = `
                <div class="username">${msg.username}</div>
                <div class="text">${msg.text}</div>
            `;
            
            messages.appendChild(messageDiv);
            messages.scrollTop = messages.scrollHeight;
        };

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if(message) {
                ws.send(JSON.stringify({
                    username: 'Usuario',
                    text: message
                }));
                input.value = '';
            }
        }

        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
